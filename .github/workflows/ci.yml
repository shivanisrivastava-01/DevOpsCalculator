name: Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build calculator
        run: make all
